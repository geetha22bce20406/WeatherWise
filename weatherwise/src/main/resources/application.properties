spring.application.name=weatherwise

# Dynamic port binding: Uses Render's $PORT if present, falls back to 8080 locally
server.port=${PORT:8080}

# Database configuration: Reads environment variables on Render, falls back to local postgres
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/weatherwise_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT configuration
weatherwise.jwt.secret=${JWT_SECRET:d2VhdGhlcndpc2UtZGV2LW9ubHktc2VjcmV0LWtleS1jaGFuZ2UtbWUtMzIr}
weatherwise.jwt.expiration-ms=86400000
